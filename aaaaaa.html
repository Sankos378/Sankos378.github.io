        }

        .container-app {

        }

        .profile-pic {

            justify-content: center;

        }

        .title-small {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 5px;
        }

        .title-large {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .action-btn:active { background-color: rgba(255, 255, 255, 0.3); }

        .info-card {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 5px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-row {
            display: block;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 0;
            color: inherit;
        }

        .info-row:active { opacity: 0.6; }
        .info-row:last-child { border-bottom: none; }

        .info-label {
            color: #b3a5d8;
            font-size: 14px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .info-label.single {
            font-size: 16px;
            margin-bottom: 0;
        }

        .info-value {
            font-size: 18px;
            font-weight: 500;
            color: white;
        }

        .share-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .share-btn:active { background-color: rgba(255, 255, 255, 0.3); }
